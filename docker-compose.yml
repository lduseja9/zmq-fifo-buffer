services:
  server:
    image: zmq-fifo-server:latest
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      - ZMQ_ENDPOINT=tcp://0.0.0.0:5555
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5555"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s

  client:
    image: zmq-fifo-client:latest
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      - ZMQ_ENDPOINT=tcp://server:5555
    depends_on:
      server:
        condition: service_healthy
    restart: on-failure
